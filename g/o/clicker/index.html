<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Clicker</title><body style="margin:0;background:#123;color:#fff;font:20px sans-serif;text-align:center"><h1 id=n>0</h1><button id=b style="font-size:40px;padding:30px 60px">Click</button><p>Auto clickers: <span id=a>0</span></p><button id=u style="font-size:18px">Buy (cost <span id=k>10</span>)</button><script>let n=0,a=0,k=10;const r=()=>{document.getElementById("n").textContent=Math.floor(n);document.getElementById("a").textContent=a;document.getElementById("k").textContent=k};b.onclick=()=>{n++;r()};u.onclick=()=>{if(n>=k){n-=k;a++;k=Math.ceil(k*1.4);r()}};setInterval(()=>{n+=a/10;r()},100)</script>
