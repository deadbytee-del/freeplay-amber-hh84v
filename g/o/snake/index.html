<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Snake</title><body style="margin:0;background:#111"><canvas id=c width=400 height=400 style="display:block;margin:auto;max-width:100%"></canvas><script>const c=document.getElementById("c"),x=c.getContext("2d");let s=[{x:10,y:10}],d={x:1,y:0},f={x:5,y:5},t=0,sx=0,sy=0;onkeydown=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(m&&(m[0]!==-d.x||m[1]!==-d.y))d={x:m[0],y:m[1]}};ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};ontouchend=e=>{const a=e.changedTouches[0].clientX-sx,b=e.changedTouches[0].clientY-sy;const n=Math.abs(a)>Math.abs(b)?{x:Math.sign(a),y:0}:{x:0,y:Math.sign(b)};if(n.x!==-d.x||n.y!==-d.y)d=n};setInterval(()=>{const h={x:(s[0].x+d.x+20)%20,y:(s[0].y+d.y+20)%20};if(s.some(p=>p.x==h.x&&p.y==h.y)){s=[{x:10,y:10}];t=0}s.unshift(h);if(h.x==f.x&&h.y==f.y){t++;f={x:Math.random()*20|0,y:Math.random()*20|0}}else s.pop();x.fillStyle="#111";x.fillRect(0,0,400,400);x.fillStyle="#e33";x.fillRect(f.x*20,f.y*20,18,18);x.fillStyle="#3e3";s.forEach(p=>x.fillRect(p.x*20,p.y*20,18,18));x.fillStyle="#fff";x.fillText("Score "+t,8,14)},100)</script>
